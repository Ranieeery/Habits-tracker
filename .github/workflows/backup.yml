# Weekly D1 export to the private R2 bucket (objects expire after 90 days by
# the bucket's lifecycle rule), on top of the pre-deploy backups. It checks
# /health first, so a failed run also means "production is down": GitHub
# emails the failure. Never upload exports as workflow artifacts: the
# repository is public.
#
# Secrets (environment "backup", deployments from main only):
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. See README.md, "Runbook".
name: backup

on:
  schedule:
    - cron: "0 7 * * 0" # Sundays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://habits.rxniery.workers.dev
  D1_DATABASE: habits
  BACKUP_BUCKET: habits-backups

jobs:
  backup:
    name: health check and D1 backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own environment, without required reviewers (a weekly approval
    # would defeat the schedule) and with its own narrower token: D1 Edit and
    # R2 Storage Edit only, no Workers deploy permission.
    environment: backup
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Health check
        run: |
          curl --silent --show-error --fail --retry 6 --retry-delay 10 --retry-all-errors \
            "$PRODUCTION_URL/api/v1/health" | grep -q '"status":"ok"'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile

      - name: Back up D1 to R2
        working-directory: apps/api
        run: |
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          file="$RUNNER_TEMP/$D1_DATABASE.sql"
          pnpm exec wrangler d1 export "$D1_DATABASE" --remote --output "$file"
          gzip -9 -n "$file"
          pnpm exec wrangler r2 object put \
            "$BACKUP_BUCKET/weekly/$stamp.sql.gz" \
            --file "$file.gz" --content-type application/gzip --remote
          rm -f "$file.gz"
