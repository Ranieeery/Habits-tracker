# Every check a change must pass, reused by ci.yml (pull requests and
# branches) and deploy.yml (main, before deploying). Uses no secrets, so it is
# safe for pull requests from forks.
name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version from "packageManager" in package.json; caches the store.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Turborepo local cache (typecheck, build:types, build outputs).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Migrations must stay additive (README.md, "Mudança destrutiva").
      - run: pnpm --filter api migrations:check
      - run: pnpm --filter web build
      # The same Metro export `eas update` runs: catches bundling errors (such
      # as a Babel plugin that only resolves through local hoisting) before a
      # deploy reaches the OTA step.
      - name: Bundle the mobile app (expo export)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://habits.rxniery.workers.dev/api
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/mobile-bundle"

      # Bundles both Workers exactly as a deploy would, without uploading.
      - name: wrangler deploy --dry-run (api)
        run: pnpm --filter api exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/api-bundle"
      - name: wrangler deploy --dry-run (web)
        run: pnpm --filter web exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-bundle"
