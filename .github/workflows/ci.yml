# Pull requests, pushes to branches other than main (main runs deploy.yml,
# which repeats these checks before deploying) and a weekly run on main that
# catches new advisories and toolchain drift. `pull_request`, never
# `pull_request_target`: pull requests from forks get no secrets.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Informative only: dependency advisories never block a change.
  audit:
    name: pnpm audit (informative)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm audit --prod
