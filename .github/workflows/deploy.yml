# Production deploy on every push to main (and by hand): checks, then, after
# the owner approves the "production" environment, D1 backup to R2, remote
# migrations, API Worker, web Worker, a smoke test and, when the mobile app
# (or a package it uses) changed, the EAS Update. One job, so one approval.
# Runs one at a time and never cancels a deploy in progress.
#
# Secrets (environment "production"): CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, EXPO_TOKEN. See README.md, "Runbook".
# The repository is public, and so are these logs: no step prints SQL, data
# or secret values.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mobile_update:
        description: Publish an EAS Update even if nothing in the app changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://habits.rxniery.workers.dev
  D1_DATABASE: habits
  BACKUP_BUCKET: habits-backups

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: backup, migrate, deploy, smoke test, mobile update
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://habits.rxniery.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History for the "did the mobile app change?" diff.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile

      # Always, even without pending migrations: every deploy has a restore
      # point older than Time Travel's 7 days. The dump goes from the runner's
      # temp directory straight to the private bucket.
      - name: Back up D1 to R2
        working-directory: apps/api
        run: |
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          file="$RUNNER_TEMP/$D1_DATABASE.sql"
          pnpm exec wrangler d1 export "$D1_DATABASE" --remote --output "$file"
          gzip -9 -n "$file"
          pnpm exec wrangler r2 object put \
            "$BACKUP_BUCKET/pre-deploy/$stamp-$GITHUB_SHA.sql.gz" \
            --file "$file.gz" --content-type application/gzip --remote
          rm -f "$file.gz"

      # Additive only (checked by migrations:check): the running API and older
      # mobile builds keep working while this applies. Wrangler confirms by
      # itself in CI.
      - name: Apply D1 migrations
        run: pnpm --filter api exec wrangler d1 migrations apply DB --remote

      # The API first: the web's service binding needs it, and the new web may
      # call new routes.
      - name: Deploy API Worker (habits-api)
        run: pnpm --filter api exec wrangler deploy --message "${GITHUB_SHA::7}"

      - name: Build and deploy web Worker (habits)
        run: |
          pnpm --filter api build:types
          pnpm --filter web build
          pnpm --filter web exec wrangler deploy --message "${GITHUB_SHA::7}"

      - name: Smoke test
        run: |
          check() { curl --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$@"; }
          health="$(check --fail "$PRODUCTION_URL/api/v1/health")"
          echo "health: $health"
          echo "$health" | grep -q '"status":"ok"'
          docs="$(check --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL/api/v1/docs")"
          echo "docs: $docs"
          test "$docs" = "404"
          headers="$(check --fail --head "$PRODUCTION_URL/")"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'

      # Only when the app's JS can have changed. Native changes are fine too:
      # the fingerprint runtime version keeps an update away from builds it
      # does not fit (README.md, "Build novo ou OTA").
      - name: Did the mobile app change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.mobile_update }}
        run: |
          paths="apps/mobile packages/core packages/contracts packages/api-client packages/design-tokens pnpm-lock.yaml"
          if [ "$FORCE" = "true" ]; then
            result=true
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            result=true
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $paths; then
            result=false
          else
            result=true
          fi
          echo "mobile=$result" >> "$GITHUB_OUTPUT"
          echo "mobile changed: $result"

      # EXPO_PUBLIC_API_URL comes from the EAS "production" environment.
      - name: eas update
        if: steps.changed.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          title="$(printf '%s' "${COMMIT_TITLE:-manual}" | head -n 1)"
          pnpm dlx eas-cli@24.8.0 update \
            --channel production --environment production \
            --platform android \
            --message "${GITHUB_SHA::7} $title" --non-interactive
