packages:
  - apps/*
  - packages/*

# Shared versions; reference them with "catalog:" in package.json.
catalog:
  "@types/react": ~19.2.0
  react: 19.2.3
  react-dom: 19.2.3
  typescript: ~6.0.3
  vitest: ^4.1.11
  zod: ^4.6.5

# Dependencies allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@types/node@24.19.2"
